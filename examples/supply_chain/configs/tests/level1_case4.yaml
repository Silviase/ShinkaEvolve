# Asymmetric costs: cheap long edge vs costly short edge; tests cost-awareness under single period.
description: "Depot must split between low-cost-long and high-cost-short routes; demands unequal."
level: 1
horizon: 1
num_nodes: 4
edges:
  - [0, 1]   # cheap, higher capacity
  - [0, 2]   # expensive, lower capacity
  - [1, 3]   # long path to demand A
  - [2, 3]   # short path to demand A
supply_nodes: [0]
demand_nodes: [3]

demand_uniform:
  - {node: 3, low: 18.0, high: 18.0}

initial_inventory: [20.0, 0.0, 0.0, 0.0]
edge_capacity: [12.0, 8.0, 12.0, 8.0]
edge_cost: [0.8, 1.5, 1.0, 0.7]
availability_default: true
risk_default: 0.0
loss_penalty: 1.0

weights: {supply_reward_weight: 1.0, cost_weight: 0.12, risk_weight: 0.0}
cvar: {lambda: 0.0, tau: 0.2}
