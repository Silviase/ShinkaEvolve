# One-hop + hub with three demand nodes; tests basic split across hub vs direct edge.
level: 1
horizon: 1
num_nodes: 5
edges:
  - [0, 1]   # supply -> hub
  - [1, 2]   # hub -> demand
  - [1, 3]   # hub -> demand
  - [0, 4]   # direct supply -> demand (bypasses hub)
supply_nodes: [0]
demand_nodes: [2, 3, 4]

demand_uniform:
  - {node: 2, low: 6.0, high: 8.0}
  - {node: 3, low: 6.0, high: 8.0}
  - {node: 4, low: 10.0, high: 12.0}

initial_inventory: [28.0, 5.0, 0.0, 0.0, 0.0]
edge_capacity: [14.0, 9.0, 9.0, 10.0]
edge_cost: [1.0, 1.2, 1.2, 0.9]
availability_default: true
risk_default: 0.0
loss_penalty: 1.0

weights:
  supply_reward_weight: 1.0
  cost_weight: 0.08
  risk_weight: 0.0

cvar: {lambda: 0.0, tau: 0.2}
