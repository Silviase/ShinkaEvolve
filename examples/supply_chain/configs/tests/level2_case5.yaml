# Two supply nodes, shared bottleneck hub, mild oscillation; tests coordination of dual depots.
description: "Dual depots feeding a shared forwarder and two demands; horizon 7 with modest injection."
level: 2
horizon: 7
num_nodes: 6
edges:
  - [0, 2]   # depot A -> hub
  - [1, 2]   # depot B -> hub
  - [2, 3]   # hub -> demand
  - [2, 4]   # hub -> demand
  - [1, 5]   # depot B -> demand
supply_nodes: [0, 1]
demand_nodes: [3, 4, 5]

demand_waves:
  - {node: 3, base: 7.0, amplitude: 1.5, freq: 0.6, func: sin}
  - {node: 4, base: 6.5, amplitude: 1.4, freq: 0.7, func: cos}
  - {node: 5, base: 5.0, amplitude: 1.2, freq: 0.5, func: sin}

edge_capacity: [10.0, 10.0, 9.0, 9.0, 8.0]
edge_cost: [1.0, 1.0, 1.0, 1.0, 0.9]
availability_default: true
risk_default: 0.0
loss_penalty: 1.0

initial_inventory: [20.0, 22.0, 8.0, 0.0, 0.0, 0.0]
supply_injection:
  per_period:
    - {node: 0, amount: 4.0}
    - {node: 1, amount: 4.0}

weights: {supply_reward_weight: 1.0, cost_weight: 0.06, risk_weight: 0.0}
cvar: {lambda: 0.0, tau: 0.2}
