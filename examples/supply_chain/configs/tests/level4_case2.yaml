# High-penalty, asymmetric availability; tests reliance on a risky but short path vs longer detour.
level: 4
horizon: 14
num_nodes: 8
edges:
  - [0, 1]   # depot -> hub A (short, risky)
  - [0, 2]   # depot -> hub B (longer)
  - [1, 3]   # A -> demand/front
  - [2, 3]   # B -> demand/front (detour)
  - [1, 4]   # A -> demand leaf
  - [2, 5]   # B -> demand leaf
  - [3, 6]   # front -> deep demand
  - [3, 7]   # front -> deep demand
  - [2, 1]   # B -> A backhaul
supply_nodes: [0]
demand_nodes: [3, 4, 5, 6, 7]

demand_sinusoidal:
  - {node: 3, base: 8.0, amplitude: 2.0, phase: 0.0}
  - {node: 4, base: 5.5, amplitude: 1.4, phase: 0.4}
  - {node: 5, base: 5.0, amplitude: 1.6, phase: 0.8}
  - {node: 6, base: 4.5, amplitude: 1.2, phase: 1.0}
  - {node: 7, base: 4.5, amplitude: 1.0, phase: 1.2}

edge_capacity: [18.0, 15.0, 12.0, 10.0, 9.0, 9.0, 7.0, 7.0, 8.0]
edge_cost: [0.9, 1.3, 1.0, 1.2, 1.1, 1.1, 1.0, 1.0, 0.8]

availability:
  open_probability: 0.7    # baseline
  # Riskier short path on hub A side (edges 0,2,4); hub B side more reliable.
  per_edge: [0.6, 0.82, 0.6, 0.82, 0.65, 0.82, 0.7, 0.7, 0.78]
risk:
  range: [0.1, 0.4]
  per_edge_range:
    - [0.18, 0.48]   # depot->hub A (short but risky)
    - [0.08, 0.30]   # depot->hub B
    - [0.18, 0.48]   # A->front
    - [0.10, 0.32]   # B->front
    - [0.20, 0.50]   # A->leaf
    - [0.10, 0.32]   # B->leaf
    - [0.12, 0.36]   # deep demand edges
    - [0.12, 0.36]
    - [0.10, 0.30]   # backhaul
loss_penalty: 1.6

initial_inventory: [170.0, 20.0, 20.0, 6.0, 0.0, 0.0, 0.0, 0.0]

supply_injection:
  per_period:
    - {node: 0, amount: 9.0}

weights:
  supply_reward_weight: 1.0
  cost_weight: 0.08
  risk_weight: 0.7

cvar: {lambda: 0.0, tau: 0.2}
