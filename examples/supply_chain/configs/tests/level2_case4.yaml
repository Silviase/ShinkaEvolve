# Mid-layer demand that also forwards; asymmetric capacities; 8-step horizon.
description: "Depot->two hubs feeding a forwarder (also demand) and leaves; tests balancing consume vs forward."
level: 2
horizon: 8
num_nodes: 7
edges:
  - [0, 1]
  - [0, 2]
  - [1, 3]
  - [2, 3]
  - [3, 4]
  - [1, 5]
  - [2, 6]
supply_nodes: [0]
demand_nodes: [3, 4, 5, 6]

demand_waves:
  - {node: 3, base: 5.0, amplitude: 1.8, freq: 0.5, func: sin}
  - {node: 4, base: 6.0, amplitude: 1.5, freq: 0.4, func: cos}
  - {node: 5, base: 4.5, amplitude: 1.2, freq: 0.6, func: sin}
  - {node: 6, base: 4.0, amplitude: 1.0, freq: 0.7, func: cos}

edge_capacity: [14.0, 14.0, 9.0, 9.0, 7.0, 8.0, 8.0]
edge_cost: [1.0, 1.0, 1.1, 1.1, 1.0, 0.9, 0.9]
availability_default: true
risk_default: 0.0
loss_penalty: 1.0

initial_inventory: [80.0, 10.0, 10.0, 6.0, 0.0, 0.0, 0.0]
supply_injection:
  per_period:
    - {node: 0, amount: 6.0}

weights: {supply_reward_weight: 1.0, cost_weight: 0.06, risk_weight: 0.0}
cvar: {lambda: 0.0, tau: 0.2}
