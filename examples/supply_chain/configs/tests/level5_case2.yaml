# Stress case: one depot frequently blocked, asymmetric costs, and deep chain with shared sink.
level: 5
horizon: 18
num_nodes: 10
edges:
  - [0, 2]   # depot A -> hub A
  - [1, 3]   # depot B -> hub B (cheaper but less reliable)
  - [2, 4]   # hub A -> hub C
  - [3, 4]   # hub B -> hub C (converge)
  - [4, 5]   # hub C -> hub D (also demand)
  - [5, 6]   # hub D -> demand leaf
  - [5, 7]   # hub D -> demand leaf
  - [4, 8]   # hub C -> demand leaf
  - [2, 9]   # hub A -> alternate demand leaf
  - [3, 9]   # hub B -> alternate demand leaf
supply_nodes: [0, 1]
demand_nodes: [5, 6, 7, 8, 9]   # 5 consumes and forwards

demand_regimes:
  base_demands:
    5: 7.0
    6: 7.5
    7: 7.0
    8: 8.0
    9: 6.0
  regimes:
    - {until: 6, scale: 1.0, volatility: 1.0, risk_base: 0.1}   # normal
    - {until: 12, scale: 1.5, volatility: 1.8, risk_base: 0.22} # peak
    - {until: null, scale: 1.1, volatility: 1.2, risk_base: 0.14} # recovery
  risk_spread: 0.35

edge_capacity: [18.0, 18.0, 12.0, 12.0, 11.0, 9.0, 9.0, 9.0, 8.0, 8.0]
edge_cost:     [1.2, 0.9, 1.1, 1.0, 1.1, 1.2, 1.2, 1.1, 1.3, 1.0]

availability:
  primary: 0.75    # edges 0-5 treated as primary
  secondary: 0.62
  primary_edges: 5
  # Depot B side (edges 1,3,5,7,9) is less reliable than depot A side.
  per_edge: [0.82, 0.6, 0.8, 0.65, 0.72, 0.64, 0.64, 0.72, 0.78, 0.6]

# Extra risk on depot B side edges to reflect fragility.
risk_base_shift_per_edge: [0.0, 0.08, 0.0, 0.06, 0.0, 0.06, 0.06, 0.0, 0.0, 0.08]

loss_penalty: 1.8

initial_inventory: [190.0, 160.0, 28.0, 28.0, 12.0, 8.0, 0.0, 0.0, 0.0, 5.0]

supply_injection:
  per_period:
    - {node: 0, amount: 8.0}
    - {node: 1, amount: 8.0}

weights:
  supply_reward_weight: 1.0
  cost_weight: 0.05
  risk_weight: 0.9

cvar:
  lambda: 0.45
  tau: 0.25
