# Two depots with asymmetric reliability/cost; rewards risk-aware flow splitting and buffering before mid-horizon surge.
description: "Reliable-but-expensive depot A vs cheap fragile depot B; mid-horizon surge with high CVaR penalty."
level: 5
horizon: 22
num_nodes: 10
edges:
  - [0, 2]   # depot A chain (reliable, costlier)
  - [2, 4]
  - [4, 6]
  - [6, 8]
  - [1, 3]   # depot B chain (cheaper, fragile)
  - [3, 5]
  - [5, 7]
  - [7, 8]
  - [2, 5]   # cross support A -> B side
  - [3, 4]   # cross support B -> A side
  - [4, 9]   # shared sink branch from reliable side
  - [5, 9]   # shared sink branch from fragile side
supply_nodes: [0, 1]
demand_nodes: [6, 7, 8, 9]

demand_regimes:
  base_demands:
    6: 7.5
    7: 7.0
    8: 8.0
    9: 6.5
  regimes:
    - {until: 8,  scale: 0.9, volatility: 0.8,  risk_base: 0.10}
    - {until: 14, scale: 1.6, volatility: 2.2, risk_base: 0.20}   # surge window
    - {until: null, scale: 1.2, volatility: 1.4, risk_base: 0.12} # recovery with residual risk
  risk_spread: 0.30

edge_capacity: [18.0, 16.0, 14.0, 12.0, 17.0, 14.0, 12.0, 10.0, 9.0, 9.0, 8.0, 8.0]
edge_cost:     [1.15, 1.10, 1.05, 1.00, 0.90, 0.90, 0.95, 1.00, 1.05, 1.05, 1.10, 1.05]

availability:
  primary: 0.82
  secondary: 0.66
  primary_edges: 4
  per_edge:
    - 0.86  # 0->2 (reliable)
    - 0.84  # 2->4
    - 0.82  # 4->6
    - 0.82  # 6->8
    - 0.64  # 1->3 (fragile chain)
    - 0.64  # 3->5
    - 0.62  # 5->7
    - 0.60  # 7->8
    - 0.74  # 2->5 cross
    - 0.74  # 3->4 cross
    - 0.80  # 4->9 (reliable branch)
    - 0.68  # 5->9 (fragile branch)

risk_base_shift_per_edge: [0.0, 0.0, 0.02, 0.02, 0.10, 0.12, 0.12, 0.10, 0.05, 0.05, 0.04, 0.08]

loss_penalty: 1.8

initial_inventory: [190.0, 170.0, 28.0, 24.0, 14.0, 12.0, 8.0, 6.0, 0.0, 6.0]

supply_injection:
  per_period:
    - {node: 0, amount: 9.0}
    - {node: 1, amount: 8.0}

weights: {supply_reward_weight: 1.0, cost_weight: 0.05, risk_weight: 0.9}

cvar:
  lambda: 0.5
  tau: 0.25
