# CVaR-heavy risk focus: higher lambda; asymmetric depots and long detour to deep sink.
description: "Depot A more reliable/costly; Depot B cheaper/riskier; deep sink via long path. CVaR-weighted."
level: 5
horizon: 21
num_nodes: 9
edges:
  - [0, 2]
  - [1, 3]
  - [2, 4]
  - [3, 4]
  - [4, 5]
  - [5, 6]
  - [5, 7]
  - [4, 8]
  - [3, 2]
supply_nodes: [0, 1]
demand_nodes: [5, 6, 7, 8]

demand_regimes:
  base_demands:
    5: 8.0
    6: 7.5
    7: 7.5
    8: 7.0
  regimes:
    - {until: 8, scale: 1.0, volatility: 1.0, risk_base: 0.1}
    - {until: 16, scale: 1.45, volatility: 1.7, risk_base: 0.2}
    - {until: null, scale: 1.15, volatility: 1.2, risk_base: 0.14}
  risk_spread: 0.35

edge_capacity: [18.0, 18.0, 12.0, 12.0, 11.0, 10.0, 9.0, 9.0, 8.0]
edge_cost:     [1.2, 0.9, 1.1, 1.0, 1.1, 1.2, 1.1, 1.1, 0.9]

availability:
  primary: 0.78
  secondary: 0.65
  primary_edges: 5

loss_penalty: 1.8

initial_inventory: [190.0, 170.0, 26.0, 26.0, 12.0, 10.0, 0.0, 0.0, 0.0]

supply_injection:
  per_period:
    - {node: 0, amount: 8.0}
    - {node: 1, amount: 8.0}

weights: {supply_reward_weight: 1.0, cost_weight: 0.05, risk_weight: 0.85}

cvar:
  lambda: 0.5
  tau: 0.25
