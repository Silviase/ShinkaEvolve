evaluate_function:
  _target_: examples.supply_chain.evaluate.main
  program_path: examples/supply_chain/initial.py
  results_dir: results/supply_chain
  base_seed: 13
  config_dir: configs

distributed_job_config:
  _target_: shinka.launch.SlurmCondaJobConfig
  modules:
    - "cuda/12.4"
    - "cudnn/8.9.7"
    - "hpcx/2.20"
  eval_program_path: "shinka/eval_hydra.py"
  conda_env: "shinka"
  time: "00:20:00"
  cpus: 2
  gpus: 0
  mem: "8G"

evo_config:
  task_sys_msg: |
    You are an expert operations-research / supply-chain LLM evolving a Python policy for a multi-stage supply chain on a directed graph with capacities, costs, and risk.
    Implement `logistics_policy(state: LogisticsState) -> Shipments` inside the EVOLVE-BLOCK.

    System constraints (must obey):
    - Shipments are non-negative and cannot exceed edge_capacity or source inventory; per-node outflow must respect available inventory. Skip closed edges (edge_available=False).
    - State fields: t, T, edges, inventory, demand, is_supply_node, is_demand_node, edge_capacity, edge_cost, edge_available, edge_risk, cost_weight, risk_weight, supply_reward_weight. Unknown fields may be ignored safely.
    - Risky edges: edge_risk is a per-edge failure probability; using such edges can randomly lose shipments and incur loss weighted by risk_weight.

    Scoring reminder:
    - Maximize episode score = supply_reward_weight * fulfilled - cost_weight * cost - risk_weight * loss.
    - Advanced cases uses risk-adjusted fill rate (fulfillment_rate - lambda * normalized_z).

    Key hints (be concise and robust):
    1) Horizon-aware: balance immediate demand vs. staging buffers for later steps.
    2) Risk/cost aware: prefer safer+cheaper open edges; split flow if a route is risky/fragile.
    3) Cover demand: serve demand nodes first, but keep small buffers at intermediates to avoid starvation.
    4) Multi-hop: internal nodes can have demand; support flows through intermediates (not just leaves).
    5) Peaks/uncertainty: when inventory/time allow, pre-position near volatile or risky cuts; avoid over-committing early.
    6) Graceful degradation: with tight capacity/availability, spread shipments over viable edges instead of zeroing out.
    7) Loss penalty: when risk_weight > 0, down-weight risky edges; when risk=0, emphasize cost efficiency.
    8) Optimization welcome: small LP/min-cost-flow is allowed if lightweight; otherwise fall back to a simple heuristic and be resilient to missing solvers.

    Be creative and try to find a new solution.
  language: "python"
  init_program_path: "examples/supply_chain/initial.py"
  job_type: "slurm_conda"

exp_name: "shinka_supply_chain"
